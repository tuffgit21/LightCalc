<!DOCTYPE html>
<html data-theme="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LightCalc — Web</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="CalcStyle.css" rel="stylesheet"/>
</head>
<body>
<div aria-hidden="true" class="bg-orbs">
<span class="orb orb-1"></span>
<span class="orb orb-2"></span>
<span class="orb orb-3"></span>
</div>
<main class="calculator">
<header class="calc-header">
<div class="brand">
<img alt="LightCalc design preview" class="brand-logo" id="design-preview" src="LightCalc-source/Calculator/calculator.png"/>
<span class="brand-name">LightCalc</span>
</div>
<button aria-label="Toggle dark and light mode" class="theme-toggle" id="theme-toggle" type="button">
<span aria-hidden="true" class="theme-icon">🌙</span>
</button>
</header>
<!-- Display -->
<div class="display">
<div class="history" id="history"></div>
<input aria-label="Calculator display" id="display" readonly="" type="text" value="0"/>
</div>
<!-- Buttons -->
<div class="buttons">
<button class="function" data-action="clear">AC</button>
<button class="function" data-action="delete">⌫</button>
<button class="operator" data-value="%">%</button>
<button class="operator" data-value="/">÷</button>
<button data-value="7">7</button>
<button data-value="8">8</button>
<button data-value="9">9</button>
<button class="operator" data-value="*">×</button>
<button data-value="4">4</button>
<button data-value="5">5</button>
<button data-value="6">6</button>
<button class="operator" data-value="-">−</button>
<button data-value="1">1</button>
<button data-value="2">2</button>
<button data-value="3">3</button>
<button class="operator" data-value="+">+</button>
<button class="function paren" data-action="paren">( )</button>
<button class="zero" data-value="0">0</button>
<button data-value=".">.</button>
<button class="equals" data-action="calculate">=</button>
</div>
<p class="hint">Tip: use your keyboard — digits, <kbd>+</kbd> <kbd>-</kbd> <kbd>*</kbd> <kbd>/</kbd>, <kbd>Enter</kbd> =, <kbd>Backspace</kbd> ⌫, <kbd>Esc</kbd> AC</p>
</main>
<script src="script.js"></script>
</body>
</html>
